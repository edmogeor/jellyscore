name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: |
          version=${GITHUB_REF_NAME#v}
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$version" = "$(awk -F '"' '/^version:/ { print $2 }' build.yaml)"
      - run: make check test-unit test-smoke
      - name: Extract release notes
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## / { exit }
            found && NF { started = 1 }
            found && !started { next }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
      - name: Add release notes to plugin manifest
        run: |
          python3 -c 'from pathlib import Path; import json; path = Path("build.yaml"); config = path.read_text(); placeholder = "changelog: \"\""; assert config.count(placeholder) == 1; path.write_text(config.replace(placeholder, "changelog: {}".format(json.dumps(Path("release-notes.md").read_text().strip()))))'
      - run: bash package.sh
      - run: cp build.yaml release-notes.md dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: JellyScore
          path: |
            dist/JellyScore.zip
            dist/build.yaml
            dist/release-notes.md

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: JellyScore
          path: dist
      - run: md5sum dist/JellyScore.zip > dist/plugin.md5
      - run: gh release view "$GITHUB_REF_NAME" >/dev/null || gh release create "$GITHUB_REF_NAME" dist/JellyScore.zip dist/plugin.md5 dist/build.yaml --notes-file dist/release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Wait for release in GitHub's release list
        run: |
          for attempt in {1..10}; do
            if gh api "repos/$GITHUB_REPOSITORY/releases?per_page=5" --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .assets[] | select(.name == \"build.yaml\") | .name" | grep -Fxq build.yaml; then exit 0; fi
            sleep 3
          done
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: Kevinjil/jellyfin-plugin-repo-action@296850372cd569cbcc040e834222a5afed861485
        with:
          githubToken: ${{ github.token }}
          repository: ${{ github.repository }}
          pagesBranch: manifest-release
          pagesFile: manifest.json
          ignorePrereleases: true
